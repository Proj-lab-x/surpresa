<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma mensagem pra você</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500&display=swap');

  :root {
    --navy-deep: #0a1826;
    --navy-mid: #12283d;
    --teal-glow: #1d4a5c;
    --moonlight: #eef2f6;
    --coral: #ff8f6b;
    --gold: #d9b76a;
    --ink: #d8dee6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, var(--navy-mid) 0%, var(--navy-deep) 70%);
    font-family: 'Poppins', sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Stars */
  .stars {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: var(--moonlight);
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.9; }
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fdf6e3, var(--gold) 80%);
    box-shadow: 0 0 40px 10px rgba(217, 183, 106, 0.35);
    z-index: 0;
  }

  /* Ocean */
  .ocean {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(180deg, var(--teal-glow) 0%, var(--navy-deep) 100%);
    z-index: 1;
  }
  .wave {
    position: absolute;
    width: 200%;
    height: 100%;
    top: -10px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      rgba(238, 242, 246, 0.06) 40px,
      transparent 80px
    );
    animation: waveMove 8s linear infinite;
  }
  @keyframes waveMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Bottle */
  .bottle-wrap {
    position: relative;
    z-index: 2;
    cursor: pointer;
    animation: bob 4s ease-in-out infinite;
    transition: transform 0.4s ease;
  }
  .bottle-wrap:hover {
    transform: scale(1.05);
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  .bottle-svg {
    width: 90px;
    height: auto;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
  }

  .hint {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    color: var(--ink);
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.6;
    z-index: 2;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.75; }
  }

  /* Card reveal */
  .card {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(18,40,61,0.97), rgba(10,24,38,0.99));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  .card.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .scroll {
    max-width: 480px;
    width: 88%;
    padding: 48px 40px;
    text-align: center;
    background: linear-gradient(180deg, rgba(238,242,246,0.04), rgba(238,242,246,0.01));
    border: 1px solid rgba(217, 183, 106, 0.25);
    border-radius: 4px;
    transform: translateY(30px) scale(0.96);
    opacity: 0;
    transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .card.visible .scroll {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .eyebrow {
    font-family: 'Poppins', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
    opacity: 0.85;
  }

  .message {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem;
    font-style: italic;
    line-height: 1.55;
    color: var(--moonlight);
    margin-bottom: 30px;
  }

  .signature {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--coral);
    margin-bottom: 34px;
  }

  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 28px;
    border-radius: 999px;
    border: 1px solid var(--coral);
    background: transparent;
    color: var(--moonlight);
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  .play-btn:hover {
    background: var(--coral);
    color: var(--navy-deep);
  }
  .play-btn svg {
    width: 14px;
    height: 14px;
  }

  .close-hint {
    margin-top: 26px;
    font-size: 0.72rem;
    color: var(--ink);
    opacity: 0.4;
    letter-spacing: 0.05em;
  }

  .sound-hint {
    margin-top: 14px;
    font-size: 0.75rem;
    color: var(--gold);
    opacity: 0.75;
    letter-spacing: 0.03em;
    display: none;
  }

  #videoContainer {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 20px auto;
  }
  #videoContainer iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 6px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <div class="ocean">
    <div class="wave"></div>
  </div>

  <div class="bottle-wrap" id="bottleTrigger">
    <svg class="bottle-svg" viewBox="0 0 60 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="4" width="12" height="16" rx="2" fill="#d9b76a" opacity="0.85"/>
      <path d="M22 18 L38 18 L38 34 Q50 44 50 66 L50 122 Q50 134 38 134 L22 134 Q10 134 10 122 L10 66 Q10 44 22 34 Z"
            fill="rgba(29,74,92,0.55)" stroke="rgba(238,242,246,0.5)" stroke-width="1.5"/>
      <rect x="16" y="70" width="28" height="50" rx="3" fill="#eef2f6" opacity="0.9"/>
      <line x1="20" y1="78" x2="40" y2="78" stroke="#12283d" stroke-width="0.7" opacity="0.4"/>
      <line x1="20" y1="86" x2="40" y2="86" stroke="#12283d" stroke-width="0.7" opacity="0.4"/>
      <line x1="20" y1="94" x2="40" y2="94" stroke="#12283d" stroke-width="0.7" opacity="0.4"/>
    </svg>
  </div>

  <div class="hint">toque na garrafa</div>

  <div class="card" id="card">
    <div class="scroll">
      <div class="eyebrow">uma mensagem chegou até você</div>

      <!-- ✏️ EDITE A MENSAGEM ABAIXO COM SUAS PRÓPRIAS PALAVRAS -->
      <div class="message">
        "Ainda estou te decifrando...
        mas confesso que gosto do que vejo até agora."
      </div>

      <div class="signature">de quem anda sorrindo à toa por sua causa</div>

      <div id="videoContainer"></div>
      <button class="play-btn" id="playBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        ouvir música
      </button>

      <div class="sound-hint" id="soundHint">🔊 o som já toca sozinho, sem precisar tocar na tela</div>

      <div class="close-hint">toque fora para fechar</div>
    </div>
  </div>
</div>

<script>
  // Generate stars
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 55 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
  }

  const bottle = document.getElementById('bottleTrigger');
  const card = document.getElementById('card');

  bottle.addEventListener('click', () => {
    card.classList.add('visible');
  });

  card.addEventListener('click', (e) => {
    if (e.target === card) {
      card.classList.remove('visible');
    }
  });

  // Embed video on click, playing only the instrumental intro, then stop before the lyrics
  const playBtn = document.getElementById('playBtn');
  const videoContainer = document.getElementById('videoContainer');
  const soundHint = document.getElementById('soundHint');

  playBtn.addEventListener('click', () => {
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/94-KCPOxd2Y?autoplay=1&rel=0&modestbranding=1';
    iframe.allow = 'autoplay; encrypted-media';
    iframe.allowFullscreen = true;
    videoContainer.innerHTML = '';
    videoContainer.appendChild(iframe);
    playBtn.style.display = 'none';
    soundHint.style.display = 'block';
  });
</script>

</body>
</html>
